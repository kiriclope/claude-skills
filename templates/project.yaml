# .claude/project.yaml — per-project facts read by the shared skills in ~/claude-skills.
# Skills stay generic; everything project-specific lives here. Keep it short and current.

name: myproject
memory_dir: ~/.claude/projects/-home-you-myproject/memory   # this project's memory: its path with / → -
memory_state_file: project_state.md                          # live-status memory (log-and-ship step 2)

# log-and-ship: which doc to update for which kind of work (first match wins)
docs_map:
  - work: "a sweep/experiment ran (config, result, status)"
    doc: docs/experiment_log.md
  - work: "new procedure for running things"
    doc: docs/running.md

# log-and-ship: paths never staged unless the user names them
never_stage: [results/, .claude/settings.local.json]   # CLAUDE.md is committed like any doc

# figure-gallery (maintainer-only skill; others can delete these two keys)
gallery_project: myproject
figures_root: results/figures

python: python                        # interpreter / env for this project's scripts
env_prefix: ""                        # e.g. LD_PRELOAD=<conda>/lib/libstdc++.so.6
vocabulary: {}                        # paper terms, e.g. {memory axis: SAMPLE axis}

# making-figures
figure_style: null                    # path to a .mplstyle or module; null = the skill's paper.mplstyle
figure_docs: []                       # plotting how-tos, color/marker legends to read first
figure_code: []                       # existing plotting helpers to reuse

# writing-paper / auditing-paper-numbers / verifying-citations
paper_dir: null
numbers_log: null                     # script or file that prints every number quoted in the paper
style_guide: null                     # journal/house style guide

# launching-experiments / debugging-training
launch:
  entrypoint: null                    # e.g. sweep.py
  results_root: results
  max_concurrent: 8
  n_gpus: 1
  workers_per_gpu: 4
  screen_prefix: run_
  seeds_explore: 4
  seeds_definitive: 8
running_doc: null
verdict_scripts: []
plot_entrypoint: null

# making-figures: condition → color map (colorblind-safe; values from cbstyle)
colors: {}

# reviewing-code-readability
code_rules: []                        # project-specific coding rules, one sentence each
code_check:                           # readability_check.py settings
  max_line: 120
  max_depth: 4
  max_function_lines: 80
  derived_names: []                   # names the config derives (alpha, dt, …): flagged if typed in
  derived_callees: []                 # calls to watch for them (e.g. the model class); [] = any non-plotting call
  config_files: []                    # where those names are legitimately defined
  style_modules: []                   # the only files allowed to hold hex colors

# running-review-checkpoints (opt-in): a human review is due after this much change since the last one
# review_checkpoint:
#   max_lines: 300
#   max_commits: 3
#   include: [py, md, yaml, yml, toml, sh, tex, html]
#   exclude: [results/, scratchpad/]
